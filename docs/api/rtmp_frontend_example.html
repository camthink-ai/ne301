<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTMP 推流控制面板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00d9ff;
        }
        .card {
            background: #16213e;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid #0f3460;
        }
        .card h2 {
            color: #00d9ff;
            margin-bottom: 20px;
            font-size: 18px;
            border-bottom: 1px solid #0f3460;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #94a3b8;
            font-size: 14px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #0f3460;
            border-radius: 6px;
            background: #1a1a2e;
            color: #fff;
            font-size: 14px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #00d9ff;
        }
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #00d9ff;
            color: #1a1a2e;
        }
        .btn-primary:hover {
            background: #00b8d4;
        }
        .btn-success {
            background: #10b981;
            color: #fff;
        }
        .btn-success:hover {
            background: #059669;
        }
        .btn-danger {
            background: #ef4444;
            color: #fff;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-secondary {
            background: #475569;
            color: #fff;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-idle { background: #475569; }
        .status-connecting { background: #f59e0b; color: #1a1a2e; }
        .status-streaming { background: #10b981; }
        .status-reconnecting { background: #f59e0b; color: #1a1a2e; }
        .status-error { background: #ef4444; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 16px;
        }
        .stat-item {
            background: #1a1a2e;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #00d9ff;
        }
        .stat-label {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }
        .log-container {
            background: #0d1117;
            border-radius: 6px;
            padding: 12px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        .log-entry {
            padding: 2px 0;
            border-bottom: 1px solid #21262d;
        }
        .log-time {
            color: #7d8590;
        }
        .log-success { color: #3fb950; }
        .log-error { color: #f85149; }
        .log-info { color: #58a6ff; }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>RTMP 推流控制面板</h1>

        <!-- 状态卡片 -->
        <div class="card">
            <h2>推流状态</h2>
            <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 20px;">
                <span>状态:</span>
                <span id="streamState" class="status-badge status-idle">idle</span>
                <span id="streamingIndicator" style="display: none;">
                    <span style="display: inline-block; width: 8px; height: 8px; background: #ef4444; border-radius: 50%; animation: blink 1s infinite;"></span>
                    LIVE
                </span>
            </div>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="framesSent">0</div>
                    <div class="stat-label">发送帧数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="bytesSent">0</div>
                    <div class="stat-label">发送数据 (MB)</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="duration">0</div>
                    <div class="stat-label">推流时长 (秒)</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="bitrate">0</div>
                    <div class="stat-label">当前码率 (kbps)</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="droppedFrames">0</div>
                    <div class="stat-label">丢帧数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="errors">0</div>
                    <div class="stat-label">错误数</div>
                </div>
            </div>
        </div>

        <!-- 控制卡片 -->
        <div class="card">
            <h2>推流控制</h2>
            <div class="form-group">
                <label>RTMP 服务器地址</label>
                <input type="text" id="rtmpUrl" placeholder="rtmp://live.example.com/live">
            </div>
            <div class="form-group">
                <label>推流密钥 (Stream Key)</label>
                <input type="text" id="streamKey" placeholder="your-stream-key">
            </div>
            <div class="btn-group">
                <button class="btn btn-success" id="btnStart" onclick="startStream()">开始推流</button>
                <button class="btn btn-danger" id="btnStop" onclick="stopStream()" disabled>停止推流</button>
                <button class="btn btn-secondary" onclick="refreshStatus()">刷新状态</button>
            </div>
        </div>

        <!-- 配置卡片 -->
        <div class="card">
            <h2>视频配置</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>分辨率</label>
                    <select id="resolution">
                        <option value="1920x1080">1920x1080 (1080p)</option>
                        <option value="1280x720" selected>1280x720 (720p)</option>
                        <option value="854x480">854x480 (480p)</option>
                        <option value="640x360">640x360 (360p)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>帧率 (FPS)</label>
                    <select id="fps">
                        <option value="60">60</option>
                        <option value="30" selected>30</option>
                        <option value="25">25</option>
                        <option value="15">15</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>码率 (kbps)</label>
                    <input type="number" id="bitrate_config" value="2500" min="500" max="10000">
                </div>
                <div class="form-group">
                    <label>GOP大小</label>
                    <input type="number" id="gopSize" value="60" min="1" max="300">
                </div>
            </div>
            <div class="form-row" style="margin-top: 16px;">
                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="autoReconnect" checked>
                        <label for="autoReconnect" style="margin: 0;">断线自动重连</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>重连间隔 (ms)</label>
                    <input type="number" id="reconnectInterval" value="5000" min="1000" max="60000">
                </div>
                <div class="form-group">
                    <label>最大重连次数</label>
                    <input type="number" id="maxReconnect" value="10" min="0" max="100">
                </div>
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="saveConfig()">保存配置</button>
                <button class="btn btn-secondary" onclick="loadConfig()">加载配置</button>
            </div>
        </div>

        <!-- 日志卡片 -->
        <div class="card">
            <h2>操作日志</h2>
            <div class="log-container" id="logContainer"></div>
        </div>
    </div>

    <style>
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>

    <script>
        // ========== 配置 ==========
        const API_BASE = '/api/v1';
        const AUTH_TOKEN = 'YOUR_AUTH_TOKEN'; // 替换为实际token

        let statusPollInterval = null;

        // ========== API 封装 ==========
        const api = {
            async request(method, path, body = null) {
                const options = {
                    method,
                    headers: {
                        'Authorization': `Bearer ${AUTH_TOKEN}`,
                        'Content-Type': 'application/json'
                    }
                };
                if (body) {
                    options.body = JSON.stringify(body);
                }
                
                const response = await fetch(`${API_BASE}${path}`, options);
                return response.json();
            },

            // 获取配置
            getConfig() {
                return this.request('GET', '/apps/rtmp/config');
            },

            // 设置配置
            setConfig(config) {
                return this.request('POST', '/apps/rtmp/config', config);
            },

            // 开始推流
            startStream(url, streamKey) {
                const body = {};
                if (url) body.url = url;
                if (streamKey) body.stream_key = streamKey;
                return this.request('POST', '/apps/rtmp/start', Object.keys(body).length > 0 ? body : null);
            },

            // 停止推流
            stopStream() {
                return this.request('POST', '/apps/rtmp/stop');
            },

            // 获取状态
            getStatus() {
                return this.request('GET', '/apps/rtmp/status');
            }
        };

        // ========== UI 更新函数 ==========
        function updateStreamState(state, isStreaming) {
            const badge = document.getElementById('streamState');
            const indicator = document.getElementById('streamingIndicator');
            const btnStart = document.getElementById('btnStart');
            const btnStop = document.getElementById('btnStop');

            badge.textContent = state;
            badge.className = `status-badge status-${state}`;
            
            indicator.style.display = isStreaming ? 'inline' : 'none';
            btnStart.disabled = isStreaming;
            btnStop.disabled = !isStreaming;
        }

        function updateStats(stats) {
            document.getElementById('framesSent').textContent = stats.frames_sent.toLocaleString();
            document.getElementById('bytesSent').textContent = (stats.bytes_sent / 1024 / 1024).toFixed(2);
            document.getElementById('duration').textContent = stats.stream_duration_sec;
            document.getElementById('bitrate').textContent = stats.current_bitrate_kbps || stats.avg_frame_size;
            document.getElementById('droppedFrames').textContent = stats.dropped_frames;
            document.getElementById('errors').textContent = stats.errors;
        }

        function log(message, type = 'info') {
            const container = document.getElementById('logContainer');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="log-${type}">${message}</span>`;
            container.insertBefore(entry, container.firstChild);
            
            // 限制日志条数
            while (container.children.length > 50) {
                container.removeChild(container.lastChild);
            }
        }

        // ========== 业务函数 ==========
        async function startStream() {
            const url = document.getElementById('rtmpUrl').value;
            const streamKey = document.getElementById('streamKey').value;

            if (!url) {
                log('请输入RTMP服务器地址', 'error');
                return;
            }

            try {
                log('正在启动推流...');
                const result = await api.startStream(url, streamKey);
                
                if (result.success) {
                    log(`推流启动成功: ${result.message}`, 'success');
                    startStatusPolling();
                } else {
                    log(`推流启动失败: ${result.message}`, 'error');
                }
                
                updateStreamState(result.stream_state, result.success && result.status !== 'failed');
            } catch (error) {
                log(`请求失败: ${error.message}`, 'error');
            }
        }

        async function stopStream() {
            try {
                log('正在停止推流...');
                const result = await api.stopStream();
                
                if (result.success) {
                    log(`推流停止成功: ${result.message}`, 'success');
                    stopStatusPolling();
                } else {
                    log(`推流停止失败: ${result.message}`, 'error');
                }
                
                updateStreamState(result.stream_state, false);
            } catch (error) {
                log(`请求失败: ${error.message}`, 'error');
            }
        }

        async function refreshStatus() {
            try {
                const result = await api.getStatus();
                
                if (result.status) {
                    updateStreamState(result.status.stream_state, result.status.streaming);
                    if (result.status.url) {
                        document.getElementById('rtmpUrl').value = result.status.url;
                    }
                }
                
                if (result.statistics) {
                    updateStats(result.statistics);
                }
                
                log('状态已刷新', 'info');
            } catch (error) {
                log(`获取状态失败: ${error.message}`, 'error');
            }
        }

        async function loadConfig() {
            try {
                const result = await api.getConfig();
                
                if (result.connection) {
                    document.getElementById('rtmpUrl').value = result.connection.url || '';
                    document.getElementById('streamKey').value = result.connection.stream_key || '';
                    document.getElementById('autoReconnect').checked = result.connection.auto_reconnect;
                    document.getElementById('reconnectInterval').value = result.connection.reconnect_interval_ms;
                    document.getElementById('maxReconnect').value = result.connection.max_reconnect_attempts;
                }
                
                if (result.video) {
                    const res = `${result.video.width}x${result.video.height}`;
                    document.getElementById('resolution').value = res;
                    document.getElementById('fps').value = result.video.fps;
                    document.getElementById('bitrate_config').value = result.video.bitrate_kbps;
                    document.getElementById('gopSize').value = result.video.gop_size;
                }
                
                if (result.status) {
                    updateStreamState(result.status.stream_state, result.status.streaming);
                }
                
                log('配置已加载', 'success');
            } catch (error) {
                log(`加载配置失败: ${error.message}`, 'error');
            }
        }

        async function saveConfig() {
            const resolution = document.getElementById('resolution').value.split('x');
            
            const config = {
                connection: {
                    url: document.getElementById('rtmpUrl').value,
                    stream_key: document.getElementById('streamKey').value,
                    auto_reconnect: document.getElementById('autoReconnect').checked,
                    reconnect_interval_ms: parseInt(document.getElementById('reconnectInterval').value),
                    max_reconnect_attempts: parseInt(document.getElementById('maxReconnect').value)
                },
                video: {
                    width: parseInt(resolution[0]),
                    height: parseInt(resolution[1]),
                    fps: parseInt(document.getElementById('fps').value),
                    bitrate_kbps: parseInt(document.getElementById('bitrate_config').value),
                    gop_size: parseInt(document.getElementById('gopSize').value)
                }
            };

            try {
                const result = await api.setConfig(config);
                
                if (result.success) {
                    log('配置保存成功', 'success');
                } else {
                    log(`配置保存失败: ${result.message || result.error}`, 'error');
                }
            } catch (error) {
                log(`保存配置失败: ${error.message}`, 'error');
            }
        }

        // ========== 状态轮询 ==========
        function startStatusPolling() {
            if (statusPollInterval) return;
            
            statusPollInterval = setInterval(async () => {
                try {
                    const result = await api.getStatus();
                    
                    if (result.status) {
                        updateStreamState(result.status.stream_state, result.status.streaming);
                        
                        // 如果推流已停止，停止轮询
                        if (!result.status.streaming && result.status.stream_state === 'idle') {
                            stopStatusPolling();
                        }
                    }
                    
                    if (result.statistics) {
                        updateStats(result.statistics);
                    }
                } catch (error) {
                    console.error('Status poll error:', error);
                }
            }, 1000);
        }

        function stopStatusPolling() {
            if (statusPollInterval) {
                clearInterval(statusPollInterval);
                statusPollInterval = null;
            }
        }

        // ========== 初始化 ==========
        document.addEventListener('DOMContentLoaded', () => {
            log('RTMP控制面板已加载', 'info');
            loadConfig();
        });
    </script>
</body>
</html>
